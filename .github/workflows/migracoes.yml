# Aplica as migrações do banco no projeto Supabase do ambiente (constituição 1.3.0; ADR 0005).
#   develop -> projeto de desenvolvimento   (Environment "desenvolvimento")
#   main    -> projeto de produção          (Environment "producao", exige aprovação manual)
# Só roda em push (ou manualmente) e só quando algo em supabase/migrations muda. O CI continua
# sendo o portão de merge: este workflow NÃO substitui os testes, só leva a migração ao ambiente.
name: Migrações

on:
  push:
    branches: [develop, main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Uma execução por vez em cada branch: duas migrações simultâneas no mesmo banco seriam perigosas.
concurrency:
  group: migracoes-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    # Cada ambiente tem os próprios segredos; o de produção espera a aprovação de um revisor.
    environment: ${{ github.ref_name == 'main' && 'producao' || 'desenvolvimento' }}
    env:
      # Valores vêm dos segredos do Environment e nunca são impressos (o GitHub os mascara).
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      # Versão FIXA (a mesma do package.json): "latest" consulta a API do GitHub para descobrir a
      # versão e falha quando o limite de requisições é atingido ("rate limit exceeded").
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Ligar ao projeto do ambiente
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Mostra no log quais migrações ainda não estão no banco. Se o histórico do projeto divergir do
      # repositório, o comando falha aqui (corrigir com `supabase migration repair`, ver ADR 0005).
      # IMPORTANTE: na CLI 3 o `db push` mira o banco LOCAL por padrão. `--remote` aponta para o
      # projeto vinculado pelo passo acima; sem ele a CLI tenta falar com um Postgres que não existe.
      - name: Migrações pendentes (simulação)
        run: supabase db push --remote --dry-run

      # --yes: a CLI 3.2 pede confirmação antes de aplicar e, sem terminal, aborta sem mudar nada.
      - name: Aplicar as migrações
        run: supabase db push --remote --yes
