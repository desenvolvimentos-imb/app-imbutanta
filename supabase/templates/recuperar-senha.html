<h2>Redefinir a sua senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no app Imbutanta.</p>
<p><a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery">Criar uma nova senha</a></p>
<p>O link vale por pouco tempo e só pode ser usado uma vez. Se você não pediu, ignore esta mensagem; a sua senha continua a mesma.</p>
